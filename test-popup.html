<!DOCTYPE html>
<html>
<head><title>Test Popup</title></head>
<body>
<button onclick="openPopup()">Open</button>
<script>
function openPopup() {
    const newTab = window.open('about:blank', '_blank');
    newTab.document.write("<h1>Loading...</h1>");
    // newTab.document.close(); // Not closing it!
    setTimeout(() => {
        console.log("Navigating...");
        newTab.location.href = "https://example.com";
    }, 2000);
}
</script>
</body>
</html>
